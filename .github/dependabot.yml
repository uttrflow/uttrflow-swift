# Dependency updates, opened as pull requests so they go through the same gate as
# everything else — CI, review, merge. Nothing here can land unreviewed.
version: 2
updates:
  # Actions are the supply chain most likely to be forgotten, because nothing breaks when
  # they go stale. They are pinned to commit SHAs in the workflows; Dependabot understands
  # that and updates the SHA along with the version comment, which is the only sane way to
  # keep pinning from rotting.
  - package-ecosystem: github-actions
    directory: "/"
    schedule:
      interval: weekly
      day: wednesday
    open-pull-requests-limit: 5
    commit-message:
      prefix: "ci"
    labels: ["dependencies", "github-actions"]
    groups:
      # **The codeql-action entry points are one action and must move together.** `init`
      # writes a configuration that `autobuild` and `analyze` read, and mixing majors fails
      # with "Loaded a configuration file for version '3.37.9', but running version
      # '4.37.9'". Dependabot treats each path under the repository as its own dependency,
      # so without this it bumps `autobuild` alone and breaks the scan — which is exactly
      # what happened in #4. Listed first because Dependabot takes the first matching group.
      #
      # No `update-types` here on purpose: a codeql major has to be groupable, or the same
      # split happens again at the next one.
      codeql:
        patterns: ["github/codeql-action*"]

      # One pull request for the routine bumps rather than five. Majors are excluded and
      # come separately, because a major version of an action changes its inputs or its
      # outputs and is a change to read rather than to rubber-stamp.
      actions:
        patterns: ["*"]
        update-types: ["minor", "patch"]

  # SwiftPM.
  #
  # **Dependencies here are named by URL path, not by product name.** This is not
  # documented anywhere obvious and the first version of this file got it wrong: an ignore
  # for "Sparkle" matched nothing, and Dependabot opened the Sparkle bump this file exists
  # to prevent. The name Dependabot uses is what appears in its branch name —
  # `dependabot/swift/github.com/sparkle-project/sparkle-2.9.6` — so the identifier is
  # `github.com/sparkle-project/sparkle`. Check a branch name before trusting a pattern
  # here; a rule that matches nothing fails silently and looks like it is working.
  - package-ecosystem: swift
    directory: "/"
    schedule:
      interval: weekly
      day: wednesday
    open-pull-requests-limit: 5
    commit-message:
      prefix: "deps"
    labels: ["dependencies", "swift"]
    groups:
      # Grouped because a toolchain bump moves several of these at once, and five pull
      # requests that must land together are five chances to land four.
      apple:
        patterns: ["github.com/apple/*"]
      huggingface:
        patterns: ["github.com/huggingface/*"]
      mlx:
        patterns: ["github.com/ml-explore/*"]
    ignore:
      # Sparkle is pinned with `exact:` in Package.swift on purpose. Its framework is
      # embedded in the app bundle and signed as part of it, so a version bump is a
      # packaging change that has to be built, signed and checked by hand — not something
      # to accept from a bot. See Docs/packaging.md.
      - dependency-name: "github.com/sparkle-project/sparkle"
