# The gate every change passes before it can be merged.
#
# This is the whole of the quality story under trunk-based development, and it is worth
# being explicit about why it replaces an integration branch rather than being weaker than
# one. A staging branch tests code that has *already been merged*: a bad change is in the
# shared branch, blocking everyone else's work, and somebody has to notice and back it out.
# This runs against the merge result *before* the merge is allowed, so a change that breaks
# the build never reaches `main` at all. Earlier is strictly better; the branch was only
# ever a proxy for "has this been tested?", and this answers that question directly.
#
# It runs on pull requests and on `main`. On `main` it is belt and braces — a required
# check means nothing can land red — but `main` is what people release from, so it is
# worth knowing immediately if it ever is.
name: CI

on:
  # Pull requests into `main` and pushes to `main` run the same verification gate.
  pull_request:
    branches: [main]
  push:
    branches: [main]

concurrency:
  # A new commit supersedes a branch's run; main keeps every run so each merge gets a result.
  group: ci-${{ github.ref }}-${{ github.ref == 'refs/heads/main' && github.sha || 'tip' }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

permissions:
  contents: read

jobs:
  verify:
    name: make verify
    # Uttrflow targets macOS 26 APIs (Foundation Models, SpeechAnalyzer), so the runner
    # image must be at least as new as the deployment target. This is also why the project
    # cannot use Linux runners, which is why CI was once switched off entirely: macOS
    # minutes bill at ten times the Linux rate and a private repository pays for them.
    # A public repository does not, which is what made this file possible again.
    runs-on: macos-26
    timeout-minutes: 45

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          # The token is not needed after the checkout — nothing here pushes, and the
          # release publishes through `gh` with RELEASES_TOKEN rather than through the
          # git remote. Left persisted it sits in .git/config where every later step can
          # read it, and in the release job those steps include building third-party
          # Swift dependencies in the same job that holds the signing keychain.
          persist-credentials: false

      - name: Select Xcode
        run: sudo xcode-select -s /Applications/Xcode.app

      - name: Show toolchain
        run: |
          xcodebuild -version
          swift --version

      # Dependencies are pinned in Package.resolved, so the cache key is that file: a
      # dependency bump changes it and gets a cold build, and nothing else does.
      - name: Cache SwiftPM
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9  # v6.1.0
        with:
          path: .build
          key: spm-${{ runner.os }}-${{ hashFiles('Package.resolved') }}
          restore-keys: spm-${{ runner.os }}-

      # `make verify` is lint, the PII audit, a full build, the test suite, the 95% per-module
      # coverage floor, and the offline audit. The app bundle and its signature are checked
      # separately by app-preflight below, matching the local sequence in CONTRIBUTING.md.
      - name: Start the verify clock
        run: echo "VERIFY_START=$(date +%s)" >> "$GITHUB_ENV"

      - name: Verify
        # Keep independent checks visible while preserving a failing job for any failed prerequisite.
        run: make --keep-going verify

      # The delivery budget in Docs/performance.md is read from this line, run by run.
      - name: Record verify time
        if: ${{ !cancelled() }}
        run: echo "make verify took $(( ($(date +%s) - VERIFY_START) / 60 )) min; budget 20 min (Docs/performance.md#delivery-budget)" >> "$GITHUB_STEP_SUMMARY"

      # Compile every test target even when an earlier audit stops verification before the build.
      - name: Compile tests
        if: ${{ !cancelled() }}
        run: swift build --build-tests

      # `make verify`'s test run has crashed on this runner with no error and no exit code —
      # the log simply stops. `coverage.sh` now tees that output to a file as it runs, so if
      # the step above dies mid-run this still has something to show instead of losing it.
      - name: Show test output tail on failure
        if: failure()
        run: |
          LOG=".build/swift-test-output.log"
          if [[ -f "$LOG" ]]; then
            echo "::group::Last 300 lines of swift test output"
            tail -n 300 "$LOG"
            echo "::endgroup::"
          else
            echo "no $LOG — the crash happened before the test run started"
          fi

      - name: Upload swift test output
        if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a  # v7.0.1
        with:
          name: swift-test-output
          path: .build/swift-test-output.log
          if-no-files-found: ignore
          retention-days: 7

      # The app bundle is not part of `make verify`; this also catches packaging, resource,
      # entitlement, and signature failures. Ad-hoc signed: no certificate is needed and
      # none is available to a fork's pull request.
      - name: Build and verify the app bundle
        run: make app-preflight
