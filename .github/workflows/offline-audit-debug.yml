name: offline-audit-debug
on:
  workflow_dispatch:
  push:
    branches: [ci/offline-audit-symbols]
permissions:
  contents: read
jobs:
  audit:
    runs-on: macos-26
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 2
      - run: |
          sudo xcode-select -s /Applications/Xcode.app
          xcodebuild -version
          xcrun --show-sdk-version
          swift --version
      - name: Restore the SwiftPM cache the way ci.yml does
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9  # v6.1.0
        with:
          path: .build
          key: spm-debug-${{ github.run_id }}
          restore-keys: spm-macOS-
      - name: Stale objects present before the build
        run: |
          mkdir -p .build; date
          find .build -name 'AppleSpeechBackend.swift.o' -exec ls -l {} \; || true
      - run: swift build --product Uttrflow
      - name: Symbols behind the audit
        run: |
          B="$(swift build --show-bin-path)"
          find "$B/UttrflowSpeech.build" -name 'AppleSpeechBackend*' -exec ls -l {} \; || true
          for o in $(find "$B/UttrflowSpeech.build" -name 'AppleSpeechBackend.swift.o'); do
            nm -u "$o" | grep -Ei 'urlsession|nsurlconnection|urlrequest|urldownload|nw_connection|nw_listener|nw_browser|nw_endpoint|nw_path|nw_parameters|cfsocket|cfstream|cfnetwork|cfhttp|cfhost|cfurldownload|nsxpcconnection|assetinventory|assetinstallation| _socket$| _connect$| _getaddrinfo$| _getnameinfo$' || true
          done
          ls Sources/UttrflowSpeech | grep -i apple || echo "no AppleSpeechBackend source in this checkout"
      - name: Audit as on main (expected to fail on a stale object)
        run: |
          git show HEAD~1:Scripts/offline_audit.sh > Scripts/offline_audit_before.sh
          chmod +x Scripts/offline_audit_before.sh
          ./Scripts/offline_audit_before.sh --require-binary || echo "BEFORE: exit $?"
          rm Scripts/offline_audit_before.sh
      - name: Audit with the fix
        run: ./Scripts/offline_audit.sh --require-binary
