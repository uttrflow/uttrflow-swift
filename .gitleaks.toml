# What gitleaks is allowed to find and not fail on.
#
# Every entry below is scoped to one exact value, never to a whole file. Gitleaks
# treats `paths` and `regexes` in one allowlist entry as OR, not AND, so a path
# exemption would have skipped an entire file regardless of what string was added to
# it — this file used to do exactly that for four files and is why an accidental
# secret in one of them would not have failed the scan. There is no path exemption
# left anywhere in this file. If a fixture ever needs to move, move its regex entry
# with it rather than widening it.
#
# Four files in this tree contain things shaped exactly like credentials, on purpose:
#
#   SecretDetectionTests.swift    the fixtures for the clipboard's secret detector. Its
#                                 whole job is to recognise an AWS key, a GitHub token, a
#                                 Stripe key and a private key so the panel can mask them,
#                                 and it cannot be tested without examples of each. The
#                                 values are the vendors' own documentation examples and
#                                 invented strings.
#   InMemoryAuthenticationService.swift
#                                 the development sign-in stub, which mints its own
#                                 Ed25519 key at run time and issues a profile at
#                                 @uttrflow.invalid. Nothing it produces exists off the
#                                 machine that ran it.
#   SpeechModel.swift             the speech-model catalogue. It lists a pinned
#                                 tokenizerRevision and the SHA-256 digest of each file
#                                 the install must verify, so a published digest is the
#                                 only way to prove the file is the one that was pinned.
#                                 A SHA-256 string looks indistinguishable from a high-
#                                 entropy API key to gitleaks' default rules, but is
#                                 integrity evidence, not a credential. #666.
#
# Two value shapes are allowed by themselves: the updater's EdDSA public key, which
# ships in every app's Info.plist and which UpdateConfigurationTests pins, and the
# 40-hex / 64-hex strings this repository publishes as git revisions and SHA-256
# content digests. The EdDSA key is a public half; the hex strings are content
# identifiers, not credentials. Each is matched on its exact shape (`^…$`), so any
# value that surrounds or embeds one still fails.
#
# One invented clipboard-fixture string (`abc123def456`) is allowed for the same
# reason: `Tests/UttrflowClipboardTests/ClipboardStoreTests.swift` past commit
# `dcc06a51` writes it into a fake "old secret" file to prove the store does not
# rehydrate such clips, and the value is too short to retag with a hex regex. The
# exact match means a real credential beside it still fails.
#
# One source spelling is allowed by itself: `Curve25519.Signing.PrivateKey`, which is a
# Swift type name. It has triggered the default generic-api-key rule in account code and
# support tests, but allowing only the exact spelling means a real key beside it still
# fails the build.
#
# The same, by exact value, for what `SpeechModel` pins each tokenizer to: a commit in a
# public model repository, and the SHA-256 of two files at that commit. They are hex and
# they are long, which is all `generic-api-key` reads; they are also published by whoever
# owns the repository and are the thing that proves the download was not tampered with.
# Listing them by value rather than allowing the file means a real key committed to
# `SpeechModel.swift` still fails, and means bumping a revision has to touch this file,
# where the change is visible.
#
# `SecretDetectionTests.swift` needs one entry per fixture below: an AWS key, a Slack
# bot token, a Stripe key, a GitHub PAT, a GCP API key, an OpenAI-shaped secret, two
# short generic-secret values, and one invented OpenSSH private key block. Each is the
# vendor's own documentation example or an invented string, matched by its exact value
# (or, for the private key, its exact block) so a real key added anywhere in the file
# still fails.
#
# One of those values, `9f2b7c4e1a8d3f6b`, is short enough that a real secret could
# plausibly collide with it by value alone, so its two fixture lines are allowed by
# their exact matched text (`regexTarget = "match"`, key name and all) rather than by
# the bare value — a real `api_key`-shaped credential with that same value but a
# different key name or separator still fails.
[extend]
useDefault = true

[[allowlists]]
  description = "Intentional secret-shaped fixtures, public keys and exact Swift type-name false positives, by value."
  regexes = [
    '''^apWgly8fYgdo1U2MUj56SuqUqZ4QHv5GRZIbuLT0PGE=$''',
    '''^Curve25519\.Signing\.PrivateKey$''',
    '''^abc123def456$''',
    # openai/whisper-large-v3, and tokenizer.json and tokenizer_config.json at that commit.
    '''^06f233fe06e710322aca913c1bc4249a0d71fce1$''',
    '''^6d8cbd7cd0d8d5815e478dac67b85a26bbe77c1f5e0c6d76d1ce2abc0e5f21ca$''',
    '''^844b642c73a91359722f47b35705f7174686df33d252695d8572cf9ac03a6389$''',
    # openai/whisper-small, whose tokenizer is byte-identical to openai/whisper-base's.
    '''^973afd24965f72e36ca33b3055d56a652f456b4d$''',
    '''^27fc476bfe7f17299480be2273fc0608e4d5a99aba2ab5dec5374b4482d1a566$''',
    '''^2a4c4281cf9f51ac6ccc406fdc711a087afe6530f671fa7b80953edc498275ce$''',
    # openai/whisper-base.
    '''^e37978b90ca9030d5170a5c07aadb050351a65bb$''',
    # SecretDetectionTests.swift fixtures, one exact value per vendor shape below.
    '''^xoxb-2913847561-3847561290-KdMx8Qw2Lp$''',
    '''^ASIAY34FZKBOKMUTVV7A$''',
    '''^abc123def456ghi789$''',
    '''^Qv7RkT2mXeL9pAz4$''',
    '''^sk-proj-Qv7RkT2mXeL9pAz4Nb$''',
    '''^sk_live_51HxQmvKz8RtYnPbW3LcE$''',
    '''^AIzaSyD3mK9pQvXr2NtLw8ZbYc4FeGhJkMnOpQr$''',
    '''^ghp_A1b2C3d4E5f6G7h8I9j0K1l2M3n4O5p6Q7r8$''',
    '''^-----BEGIN OPENSSH PRIVATE KEY-----
            b3BlbnNzaC1rZXktdjEAAAAABG5vbmUAAAAEbm9uZQAAAAAAAAABAAAAMwAAAAtz
            c2gtZWQyNTUxOQAAACDkQ2VydGlmaWNhdGVOb3RSZWFsbHlBS2V5QXRBbGxIZXJl
            -----END OPENSSH PRIVATE KEY-----$''',
  ]

[[allowlists]]
  description = "The 9f2b7c4e1a8d3f6b fixture, allowed only by its exact key-name-and-value match text."
  regexTarget = "match"
  regexes = [
    '''^API_KEY=9f2b7c4e1a8d3f6b"$''',
    '''^api_key: 9f2b7c4e1a8d3f6b"$''',
  ]
