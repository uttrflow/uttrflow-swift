<meta charset="utf-8">
<title>Clipboard Panel Options</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;500;600;700&family=JetBrains+Mono:wght@500;600&display=swap">
<style>
:root{--pg:#F2F1EC;--ink:#101316;--mute:#5C6866;--line:#DEDCD4;--f:"Outfit",-apple-system,system-ui,sans-serif;--sys:-apple-system,BlinkMacSystemFont,"SF Pro Text",system-ui,sans-serif;--mono:"JetBrains Mono",ui-monospace,Menlo,monospace}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){color-scheme:dark;--pg:#08090C;--ink:#F4F4F6;--mute:#8B90A0;--line:#1E212A}}
:root[data-theme="dark"]{color-scheme:dark;--pg:#08090C;--ink:#F4F4F6;--mute:#8B90A0;--line:#1E212A}
*{box-sizing:border-box}
body{background:var(--pg);color:var(--ink);font-family:var(--sys);padding-block:28px 48px;padding-inline:16px}
.shell{max-width:1100px;margin:0 auto}
h1{font:600 24px var(--f);letter-spacing:-.02em;margin:0 0 4px}
.lede{color:var(--mute);font-size:13px;margin:0 0 14px;max-width:90ch;line-height:1.5}
.bar{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:10px;align-items:center}
.lbl{font:600 10.5px var(--mono);letter-spacing:.06em;color:var(--mute);width:60px}
.pk{all:unset;cursor:pointer;font:500 12.5px var(--f);padding:6px 12px;border-radius:999px;border:1px solid var(--line);color:var(--mute)}
.pk[aria-pressed="true"]{background:var(--ink);color:var(--pg);border-color:var(--ink)}
.note{font-size:13.5px;margin:4px 0 14px;line-height:1.5}
.stage{border-radius:16px;overflow:hidden;border:1px solid var(--line)}
.desk{position:relative;width:1000px;height:640px;transform-origin:top left;overflow:hidden;background:radial-gradient(90% 70% at 15% 10%,#3E368A,transparent 65%),radial-gradient(80% 70% at 95% 95%,#128077,transparent 65%),#0B0C10;font-family:var(--sys)}
.mail{position:absolute;left:40px;top:60px;width:560px;height:420px;border-radius:12px;overflow:hidden;background:rgba(250,250,247,.96);color:#101316;box-shadow:0 30px 60px rgba(0,0,0,.5)}
@keyframes blink{50%{opacity:0}}
</style>
<div class="shell">
<h1>Clipboard panel · Search-first (frozen)</h1>
<p class="lede">All five keep every function of today’s panel (search, dictate, kind and collection filters, names, pins, the ⋯ menu, sheets, hint bar, tabs). Only the look changes. Use MOMENT to check each state.</p>
<div class="bar"><span class="lbl">THEME</span><span id="th" style="display:contents"></span></div>
<div class="bar"><span class="lbl">MOMENT</span><span id="mo" style="display:contents"></span></div>
<p class="note" id="nt"></p>
<div class="stage"><div id="w"></div></div>
</div>
<script>
const sv=(p,s=16,c='currentColor',w=1.8)=>`<svg width="${s}" height="${s}" viewBox="0 0 24 24" fill="none" stroke="${c}" stroke-width="${w}" stroke-linecap="round" stroke-linejoin="round">${p}</svg>`;
const I={search:'<circle cx="11" cy="11" r="7"/><path d="m20 20-3.5-3.5"/>',mic:'<rect x="8.5" y="3" width="7" height="12" rx="3.5"/><path d="M5 11a7 7 0 0014 0M12 18v3"/>',link:'<path d="M10 14a4 4 0 005.7 0l3-3a4 4 0 00-5.7-5.7l-1 1M14 10a4 4 0 00-5.7 0l-3 3a4 4 0 005.7 5.7l1-1"/>',text:'<path d="M4 6h16M4 10h12M4 14h16M4 18h10"/>',code:'<path d="m8 8-4 4 4 4M16 8l4 4-4 4M13.5 5l-3 14"/>',key:'<circle cx="8" cy="15" r="4"/><path d="m11 12 9-9M17 6l3 3"/>',photo:'<rect x="3" y="5" width="18" height="14" rx="2"/><circle cx="9" cy="10" r="2"/><path d="m21 16-5-5-8 8"/>',pin:'<path d="M12 17v5M5 17h14l-2-4V5H7v8z"/>',dots:'<circle cx="5" cy="12" r="1.3"/><circle cx="12" cy="12" r="1.3"/><circle cx="19" cy="12" r="1.3"/>',clip:'<rect x="7" y="4" width="10" height="4" rx="1"/><path d="M8 6H6.5A1.5 1.5 0 005 7.5v12A1.5 1.5 0 006.5 21h11a1.5 1.5 0 001.5-1.5v-12A1.5 1.5 0 0017.5 6H16"/>',tag:'<path d="M3 12V4h8l10 10-8 8z"/><circle cx="7.5" cy="7.5" r="1.5"/>',sliders:'<path d="M4 7h10M18 7h2M4 17h4M12 17h8"/><circle cx="16" cy="7" r="2"/><circle cx="10" cy="17" r="2"/>',insert:'<path d="M12 3v12m-4-4 4 4 4-4M5 21h14"/>',eye:'<path d="M2 12s4-7 10-7 10 7 10 7-4 7-10 7S2 12 2 12z"/><circle cx="12" cy="12" r="3"/>',copy:'<rect x="9" y="9" width="11" height="11" rx="2"/><path d="M5 15V5a2 2 0 012-2h10"/>',folder:'<path d="M3 7a2 2 0 012-2h4l2 2h8a2 2 0 012 2v8a2 2 0 01-2 2H5a2 2 0 01-2-2z"/>',wand:'<path d="m4 20 11-11M15 4v3M13.5 5.5h3M19 9v2M18 10h2"/>',note:'<path d="M4 20h4L19 9l-4-4L4 16z"/>',trash:'<path d="M4 7h16M9 7V4h6v3M6 7l1 13h10l1-13"/>'};
const ic=(k,s=13)=>sv(I[k],s);
const mark=(s,c)=>`<svg width="${s*.8611}" height="${s}" viewBox="19 14 62 72"><path d="M26 37 L26 55 A24 24 0 0 0 74 55 L74 21" fill="none" stroke="${c}" stroke-width="14" stroke-linecap="round"/></svg>`;
/* Today's tokens, from BrandPalette via the panel code */
const TODAY={surface:'#0B0C10',card:'#0E1016',high:'#12151C',line:'#1E212A',label:'#F4F4F6',soft:'#8B90A0',dim:'#7A7F8E',ghost:'#656E80',accent:'#29C0B4',bright:'#5FE0D3',onAccent:'#04332F',link:'#6BB4F5',code:'#C49BF5',key:'#F0BE63',warn:'#FF8D28',border:'rgba(255,255,255,.055)',bg:'#0B0C10',glow:''};
const AG={...TODAY,bg:'rgba(9,9,15,.92)',card:'rgba(255,255,255,.045)',high:'rgba(255,255,255,.06)',line:'rgba(255,255,255,.1)',border:'rgba(255,255,255,.14)',glow:'teal',blur:1};
const THEMES=[
 {n:'1 · Aurora glass',d:'As chosen: frosted glass with the aurora, nothing else changed.',t:{...AG}},
 {n:'2 · Roomier rows',d:'Rows 40 px tall and every kind gets a small coloured tile (links blue, images teal, text grey), so the list scans faster.',t:{...AG,rowH:40,tileAll:1}},
 {n:'3 · Search-first',d:'A larger glowing search field, and the kind filters become one segmented control; collections stay as chips beside it.',t:{...AG,bigSearch:1,seg:1}},
 {n:'4 · Labelled tabs + key hints',d:'The bottom tabs get names under their icons, and the hint bar shows its shortcuts as small keycaps.',t:{...AG,tabLabels:1,keysHint:1}},
 {n:'5 · Card rows',d:'Each row sits on its own soft glass card with space between, plus coloured tiles; the most “designed”.',t:{...AG,rowH:38,tileAll:1,cards:1,keysHint:1}},
];
THEMES.splice(0,2);THEMES.splice(1);
const MOMENTS=['Browsing','⋯ menu open','Name this clip','Searching','Empty'];
let th=0,mo=0;
const ROWS=[['link','uttrflow.com/download'],['text','Can you send the deck before lunch?','',0,'pgprod'],['code','const panel = QuickPanel(width: 420)','ts'],['key','','',1],['photo','','',0,'','1280×720 · 184 KB'],['text','Flat 402, Example Residences, Bengaluru'],['link','docs.example.com/onboarding-spec','',1],['text','Meeting notes: move the review to Thursday'],['code','git checkout -b feat/menu-bar','sh'],['text','Thanks so much, really appreciate it!']];
function panel(T,m){
 const a=(c,p)=>`color-mix(in srgb,${c} ${p}%,transparent)`;
 const glyph=(k)=>{if(T.tileAll&&!(k==='code'||k==='key')){const c=k==='link'?T.link:k==='photo'?'#5FE0D3':'#A7ACB8';return `<span style="width:${T.rowH>34?26:22}px;height:${T.rowH>34?26:22}px;border-radius:7px;display:grid;place-items:center;background:${a(c,15)};color:${c}">${ic(k,T.rowH>34?13:11)}</span>`}if(k==='code'||k==='key'){const c=k==='code'?T.code:T.key;return `<span style="width:22px;height:22px;border-radius:6px;display:grid;place-items:center;background:${a(c,15)};color:${c}">${ic(k,11)}</span>`}const c=k==='link'?T.link:T.dim;return `<span style="width:17px;display:grid;place-items:center;color:${c};opacity:.62">${ic(k,11)}</span>`};
 const row=([k,t,lang,pin,alias,meas],i,sel,hov)=>`<div style="position:relative;display:flex;align-items:center;gap:9px;height:${T.rowH||34}px;padding:0 9px 0 6px;border-radius:${T.cards?10:8}px;${T.cards?`margin-bottom:4px;background:rgba(255,255,255,.035);`:''}${sel?`background:${a(T.accent,8)};box-shadow:inset 0 0 0 1px ${a(T.accent,38)}`:hov?`background:${T.high}`:''}">${glyph(k)}${k==='photo'?`<span style="width:34px;height:24px;border-radius:4px;box-shadow:inset 0 0 0 1px ${T.line};background:linear-gradient(135deg,#1F8FB0,#7A3FD1)"></span><span style="font-size:11.5px;color:${T.soft}">${meas}</span>`:''}${alias?`<span style="height:20px;padding:0 8px;border-radius:6px;display:grid;place-items:center;font:600 11px var(--mono);color:${T.key};background:${a(T.key,14)}">${alias}</span>`:''}${lang?`<span style="height:18px;padding:0 6px;border-radius:5px;display:grid;place-items:center;font:500 10px var(--mono);color:${T.code};background:${a(T.code,12)}">${lang}</span>`:''}<span style="flex:1;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;font:${k==='code'?'12.5px var(--mono)':'12.5px var(--sys)'};color:${k==='key'?T.dim:T.label}">${k==='key'?'••••••••••••':k==='photo'?'':t}</span>${pin?`<span style="color:${T.bright}">${ic('pin',9)}</span>`:''}<span style="width:20px;display:grid;place-items:center;color:${m===1&&sel?T.bright:sel||hov?T.soft:T.ghost}">${ic('dots',11)}</span></div>`;
 const q=m===3?'deck':'';
 const search=`<div style="display:flex;align-items:center;gap:9px;padding:12px 12px 10px">${mark(18,T.bright)}<div style="flex:1;display:flex;align-items:center;gap:9px;height:${T.bigSearch?42:34}px;padding:0 ${T.bigSearch?14:11}px;border-radius:${T.bigSearch?12:9}px;background:${T.card};box-shadow:inset 0 0 0 1px ${m===3||T.bigSearch?a(T.accent,T.bigSearch?45:30):T.line}${T.bigSearch?`,0 0 24px -6px ${a(T.accent,60)}`:''};font-size:${T.bigSearch?14:12.5}px;font-size:12.5px"><span style="color:${T.dim}">${ic('search',13)}</span>${q?`<span style="color:${T.label}">${q}<span style="display:inline-block;width:1.5px;height:14px;background:${T.accent};vertical-align:-2px;animation:blink 1s steps(1) infinite"></span></span>`:`<span style="color:${T.dim}">Search, or type an alias</span>`}</div><span title="Dictate — the words go where your cursor is" style="width:34px;height:34px;border-radius:9px;display:grid;place-items:center;background:${T.card};box-shadow:inset 0 0 0 1px ${T.line};color:${T.soft}">${ic('mic',14)}</span></div>`;
 const chip=(l,on,tint,n)=>`<span style="display:inline-flex;align-items:center;height:26px;padding:0 9px;border-radius:13px;font:${on?600:500} 11.5px var(--sys);white-space:nowrap;${on?`color:${tint};background:${a(tint,16)};box-shadow:inset 0 0 0 1px ${a(tint,35)}`:`color:${T.soft};box-shadow:inset 0 0 0 1px ${T.line}`}">${l}${n?`<span style="font:500 10px var(--sys);opacity:.65;margin-left:5px">${n}</span>`:''}</span>`;
 const chips=T.seg?`<div style="display:flex;align-items:center;gap:8px;padding:0 12px 10px"><span style="display:inline-flex;padding:3px;border-radius:10px;background:rgba(255,255,255,.06)">${['All','Text','Links','Code','Images'].map((l,i)=>`<span style="padding:4px 9px;border-radius:7px;font:${i?500:600} 11.5px var(--sys);${i?`color:${T.soft}`:'background:#fff;color:#0B0C10'}">${l}</span>`).join('')}</span>${chip('Work',0,T.bright,'⌘2')}${chip('Travel',0,T.bright,'⌘3')}</div>`:`<div style="display:flex;align-items:center;gap:5px;padding:0 12px 10px;overflow:hidden">${['All','Text','Links','Code','Images'].map((l,i)=>chip(l,i===0,T.accent)).join('')}<span style="width:1px;height:15px;background:${T.line};margin:0 3px"></span>${chip('Work',0,T.bright,'⌘2')}${chip('Travel',0,T.bright,'⌘3')}</div>`;
 let list;
 if(m===4){list=`<div style="flex:1;display:grid;place-items:center;padding:0 40px;text-align:center"><div style="display:grid;justify-items:center;gap:8px"><span style="color:${T.dim}">${ic('search',22)}</span><div style="font:600 13px var(--sys);color:${T.soft}">No matches</div><div style="font-size:11.5px;color:${T.dim}">Nothing on your clipboard mentions “zebra”.</div><div style="font:600 11.5px var(--sys);color:${T.bright}">Keep “zebra” as a clip</div></div></div>`}
 else if(m===3){const hd=t=>`<div style="padding:10px 10px 4px;font:600 9.5px var(--sys);letter-spacing:.6px;color:${T.dim}">${t}</div>`;list=`<div style="flex:1;padding:6px 8px;overflow:hidden">${hd('NAMES YOU GAVE')}${row(ROWS[1],0,1,0)}${hd('CONTENTS')}${row(['text','Send the deck by Friday'],1,0,0)}${row(['text','Deck feedback from Priya'],2,0,1)}<div style="padding:5px 10px;font-size:10.5px;color:${T.dim}">4 more · keep typing to narrow it</div></div>`}
 else list=`<div style="flex:1;padding:6px 8px;overflow:hidden">${ROWS.map((r,i)=>row(r,i,i===0,i===2)).join('')}</div>`;
 const hint={0:'↑↓ to choose · ⏎ to paste · ⌘⏎ plain · ⌘Z undo · esc to close',1:'↑↓ to choose · ⏎ to paste · ⌘⏎ plain · ⌘Z undo · esc to close',2:'⏎ to save · esc to go back',3:'↑↓ to choose · ⏎ to paste · ⌘⏎ plain · ⌘Z undo · esc to close',4:'esc to close'}[m];
 const tabs=`<div style="height:${T.tabLabels?52:44}px;display:grid;grid-template-columns:repeat(5,1fr);border-top:1px solid ${T.line}">${['clip','mark','pin','tag','sliders'].map((k,i)=>`<div style="position:relative;display:grid;place-items:center;color:${i===0?T.accent:T.dim}">${i===0?`<i style="position:absolute;top:0;width:22px;height:2px;border-radius:1px;background:${T.accent}"></i>`:''}${T.tabLabels?`<div style="display:grid;justify-items:center;gap:3px">${k==='mark'?mark(13,i===0?T.accent:T.dim):ic(k,15)}<span style="font-size:9.5px">${['History','Uttrflow','Pinned','Collections','Settings'][i]}</span></div>`:(k==='mark'?mark(13,i===0?T.accent:T.dim):ic(k,15))}</div>`).join('')}</div>`;
 const menu=m===1?`<div style="position:absolute;top:84px;right:10px;width:200px;border-radius:11px;background:${T.blur?'rgba(24,22,38,.92)':T.high};box-shadow:inset 0 0 0 1px ${T.line},0 10px 22px rgba(0,0,0,.55);overflow:hidden;z-index:3"><div style="padding:9px 12px 8px;border-bottom:1px solid ${T.line}"><div style="font:500 12px var(--sys);color:${T.soft};white-space:nowrap;overflow:hidden;text-overflow:ellipsis">uttrflow.com/download</div><div style="font-size:10.5px;color:${T.dim};margin-top:2px">Link · 2 minutes ago · Safari</div></div>${[['insert','Insert',''],['copy','Copy','⌘⇧C'],['pin','Pin','⌘P'],['tag','Name','⌘N'],['folder','Move','⌘M'],['note','Make a note','⌘⇧T']].map(([k,l,s2],i)=>`<div style="display:flex;align-items:center;gap:10px;height:30px;padding:0 12px;${i===0?`background:${a(T.accent,13)}`:''}"><span style="width:15px;color:${i===0?T.bright:T.soft}">${ic(k,11)}</span><span style="flex:1;font-size:12.5px;color:${T.label}">${l}</span><span style="font-size:11px;color:${T.dim}">${s2}</span></div>`).join('')}<div style="height:1px;background:${T.line}"></div><div style="display:flex;align-items:center;gap:10px;height:30px;padding:0 12px"><span style="width:15px;color:${T.soft}">${ic('trash',11)}</span><span style="flex:1;font-size:12.5px;color:${T.label}">Delete</span><span style="font-size:11px;color:${T.dim}">⌘⇧⌫</span></div></div>`:'';
 const sheet=m===2?`<div style="position:absolute;inset:0;background:rgba(0,0,0,.45);display:grid;place-items:center;z-index:3"><div style="width:364px;padding:16px;border-radius:12px;background:${T.blur?'rgba(24,22,38,.95)':T.card};box-shadow:inset 0 0 0 1px ${T.line},0 8px 24px rgba(0,0,0,.4);display:grid;gap:12px"><div style="font:600 13px var(--sys);color:${T.label}">Name this clip</div><div style="padding:7px 10px;border-radius:8px;background:${T.surface};box-shadow:inset 0 0 0 1px ${T.accent};font-size:13px;color:${T.label}">deck<span style="display:inline-block;width:1.5px;height:14px;background:${T.accent};vertical-align:-2px;animation:blink 1s steps(1) infinite"></span></div><div style="font-size:11px;color:${T.dim}">Saved as “deck”, so it matches however you type it</div><div style="display:flex;justify-content:flex-end;gap:8px;align-items:center"><span style="font-size:12px;color:${T.soft}">Cancel</span><span style="padding:6px 12px;border-radius:999px;background:${T.accent};color:${T.onAccent};font:600 12px var(--sys)">Save</span></div></div></div>`:'';
 const glow=T.glow?`<div style="position:absolute;left:-20%;right:-20%;top:-150px;height:260px;background:${T.glow==='amber'?'conic-gradient(from 210deg,#7A3FD1,#C25E00,#FFB05C,#3E368A,#7A3FD1)':'conic-gradient(from 210deg,#7A3FD1,#4B3FC0,#1F8FB0,#2FE0CF,#7A3FD1)'};filter:blur(60px);opacity:${T.blur?.22:.25};pointer-events:none"></div>`:'';
 return `<div style="position:absolute;left:520px;top:50px;width:420px;height:560px;border-radius:16px;overflow:hidden;background:${T.bg};${T.blur?'backdrop-filter:blur(34px) saturate(1.5);-webkit-backdrop-filter:blur(34px) saturate(1.5);':''}box-shadow:inset 0 0 0 1px ${T.border},0 30px 70px -10px rgba(0,0,0,.75);display:flex;flex-direction:column;color:${T.label}">${glow}<div style="position:relative;display:flex;flex-direction:column;height:100%">${search}${chips}${list}${m===3?`<div style="padding:0 12px 8px;font-size:10.5px;color:${T.dim}">Searching everywhere · clear the search to return to Work</div>`:''}<div style="height:28px;display:flex;align-items:center;padding:0 14px;border-top:1px solid ${T.line};font-size:10px;color:${T.dim};white-space:nowrap;overflow:hidden">${T.keysHint&&(m===0||m===3)?[['↑↓','choose'],['⏎','paste'],['⌘⏎','plain'],['⌘Z','undo'],['esc','close']].map(([k,l])=>`<span style="margin-right:10px"><span style="padding:1px 5px;border-radius:4px;background:rgba(255,255,255,.1);color:${T.soft}">${k}</span> ${l}</span>`).join(''):hint}</div>${tabs}</div>${menu}${sheet}</div>`;
}
const mail=`<div class="mail"><div style="height:28px;background:#ECEAE3;display:flex;align-items:center;gap:6px;padding-left:10px">${'<i style="width:10px;height:10px;border-radius:50%;background:#D5D2C8"></i>'.repeat(3)}</div><div style="padding:14px 18px;font-size:13px;color:#6B726F;border-bottom:1px solid #E8E5DC">To: Priya · Subject: Friday</div><div style="padding:18px;font:500 15px/1.7 var(--f)">Hi Priya, here is the link: <span style="display:inline-block;width:2px;height:17px;background:#128077;vertical-align:-3px;animation:blink 1s steps(1) infinite"></span></div></div>`;
function fit(){const el=w.firstElementChild;const sc=Math.min(1,document.querySelector('.stage').clientWidth/1000);el.style.transform=`scale(${sc})`;w.style.height=640*sc+'px'}
function draw(){thEl.innerHTML=THEMES.map((t,j)=>`<button class="pk" data-t="${j}" aria-pressed="${j===th}">${t.n}</button>`).join('');moEl.innerHTML=MOMENTS.map((x,j)=>`<button class="pk" data-m="${j}" aria-pressed="${j===mo}">${x}</button>`).join('');nt.textContent=THEMES[th].d;
 w.innerHTML=`<div class="desk">${mail}${panel(THEMES[th].t,mo)}</div>`;fit()}
const thEl=document.getElementById('th'),moEl=document.getElementById('mo');
document.addEventListener('click',e=>{const t=e.target.closest('[data-t]');if(t){th=+t.dataset.t;draw()}const m=e.target.closest('[data-m]');if(m){mo=+m.dataset.m;draw()}});
addEventListener('resize',fit);draw();
</script>

<script>/* light hook */</script>
<script src="light.js?v=7"></script>
