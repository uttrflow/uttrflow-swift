<meta charset="utf-8">
<title>Uttrflow Home v2</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;500;600;700;800&family=Caveat:wght@500&family=JetBrains+Mono:wght@500&display=swap">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=EB+Garamond:wght@400..800&display=swap">
<style>
/* Logo wordmark, greeting and hero headline only. */
:root{--hf:"EB Garamond",Garamond,Georgia,serif}
:root{--pg:#F2F1EC;--ink:#101316;--mute:#5C6866;--line:#DEDCD4;--f:"Outfit",-apple-system,system-ui,sans-serif;--sys:-apple-system,BlinkMacSystemFont,"SF Pro Text",system-ui,sans-serif;--mono:"JetBrains Mono",ui-monospace,Menlo,monospace}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){color-scheme:dark;--pg:#08090C;--ink:#F4F4F6;--mute:#8B90A0;--line:#1E212A}}
:root[data-theme="dark"]{color-scheme:dark;--pg:#08090C;--ink:#F4F4F6;--mute:#8B90A0;--line:#1E212A}
*{box-sizing:border-box}
body{background:var(--pg);color:var(--ink);font-family:var(--sys);padding-block:28px 48px;padding-inline:16px;margin:0}
.shell{max-width:1200px;margin:0 auto}
h1{font:600 24px var(--f);letter-spacing:-.02em;margin:0 0 4px}
.lede{color:var(--mute);font-size:13px;margin:0 0 16px;max-width:90ch;line-height:1.5}
.stage{border-radius:18px;overflow:hidden;padding:22px;background:radial-gradient(80% 90% at 0% 100%,#3E368A,transparent 60%),radial-gradient(70% 80% at 100% 0%,#1F8FB0,transparent 60%),#0A0A12}
.win{position:relative;width:1140px;height:760px;transform-origin:top left;border-radius:16px;overflow:hidden;display:grid;grid-template-columns:232px 1fr;background:#0C0D14;box-shadow:0 0 0 1px rgba(255,255,255,.08),0 40px 90px -20px rgba(0,0,0,.8);font-family:var(--sys);color:#fff}
.lights{position:absolute;top:16px;left:18px;display:flex;gap:8px;z-index:9}.lights i{width:12px;height:12px;border-radius:50%;background:#FF5F57}.lights i:nth-child(2){background:#FEBC2E}.lights i:nth-child(3){background:#28C840}
/* sidebar island */
.side{position:relative;margin:10px 0 10px 10px;border-radius:18px;overflow:hidden;background:rgba(16,15,28,.92);box-shadow:inset 0 0 0 1px rgba(95,224,211,.18);padding:48px 12px 12px;display:flex;flex-direction:column}
.side .glow{position:absolute;left:-40px;bottom:-80px;width:300px;height:320px;background:conic-gradient(from 210deg,#7A3FD1,#4B3FC0,#1F8FB0,#2FE0CF,#7A3FD1);filter:blur(70px);opacity:.45}
.nv{position:relative;display:flex;align-items:center;gap:12px;height:40px;padding:0 12px;border-radius:12px;font:500 14px var(--sys);color:rgba(255,255,255,.72)}
.nv.on{background:linear-gradient(90deg,rgba(95,224,211,.22),rgba(95,224,211,.06));color:#fff;box-shadow:inset 0 0 0 1px rgba(95,224,211,.25)}
.nv.on:before{content:"";position:absolute;left:0;top:10px;bottom:10px;width:3px;border-radius:2px;background:#5FE0D3}
.grp{position:relative;font:600 10.5px var(--sys);letter-spacing:.1em;color:rgba(255,255,255,.4);padding:22px 12px 8px}
.badge{margin-left:auto;font:600 11px var(--sys);padding:2px 8px;border-radius:999px;background:rgba(255,255,255,.1)}
/* main */
.main{position:relative;padding:34px 28px 22px 28px;overflow:hidden;display:flex;flex-direction:column;gap:16px}
.card{border-radius:18px;background:rgba(255,255,255,.035);box-shadow:inset 0 0 0 1px rgba(255,255,255,.08)}
.hero{position:relative;flex:none;height:282px;border-radius:20px;overflow:hidden;background:radial-gradient(70% 90% at 80% 50%,rgba(31,143,176,.28),transparent 60%),radial-gradient(60% 80% at 10% 100%,rgba(122,63,209,.2),transparent 60%),#0E111A;box-shadow:inset 0 0 0 1px rgba(95,224,211,.28),0 0 40px -10px rgba(95,224,211,.25)}
.hw{font:800 52px/1 var(--hf,var(--f));letter-spacing:-.04em}
.stat{position:relative;overflow:hidden;height:74px;border-radius:16px;display:flex;align-items:center;gap:14px;padding:0 16px}
.row{display:flex;align-items:center;gap:14px;height:56px;padding:0 14px;border-radius:14px;background:rgba(255,255,255,.035);box-shadow:inset 0 0 0 1px rgba(255,255,255,.07)}
.vbtn{padding:7px 18px;border-radius:10px;background:rgba(255,255,255,.06);box-shadow:inset 0 0 0 1px rgba(255,255,255,.14);font:500 13px var(--sys)}
.mbtn{width:34px;height:34px;border-radius:10px;display:grid;place-items:center;background:rgba(255,255,255,.06);box-shadow:inset 0 0 0 1px rgba(255,255,255,.14);color:rgba(255,255,255,.7)}
@keyframes wv{0%,100%{transform:scaleY(.35)}50%{transform:scaleY(1)}}
@keyframes slide{0%{transform:translateX(-100%)}100%{transform:translateX(340%)}}
@keyframes blink{50%{opacity:0}}
.tw{display:inline-block;overflow:hidden;white-space:nowrap;animation:type 3.2s steps(46) infinite alternate}@keyframes type{from{max-width:0}to{max-width:30em}}
@keyframes bob{50%{transform:translateY(-3px)}}
/* light */
.lt .hero{background:radial-gradient(70% 90% at 80% 50%,rgba(31,143,176,.14),transparent 60%),radial-gradient(60% 80% at 10% 100%,rgba(122,63,209,.12),transparent 60%),#FFFFFF!important;box-shadow:inset 0 0 0 1px rgba(18,128,119,.28),0 10px 30px -14px rgba(18,128,119,.35)!important}
.lt .hero .hw{color:#101316}
.lt .card,.lt .row{background:#fff}
.lt .mbtn,.lt .vbtn{background:rgba(16,19,22,.04);box-shadow:inset 0 0 0 1px rgba(16,19,22,.14);color:#101316}
.lt .stat svg{filter:brightness(.78) saturate(1.3)}
.lt .stat svg circle:first-child{stroke:rgba(16,19,22,.1)}
@media (prefers-reduced-motion:reduce){*{animation:none!important}}
</style>
<div class="shell">

<p class="lede">Rebuilt from your screenshot in the Uttrflow palette. The panda and greeting follow the time of day (opens on the current one); tap a mood to preview it. Texts, names and numbers are examples.</p>
<div id="mp" style="display:flex;gap:8px;flex-wrap:wrap;margin-bottom:10px"></div><div id="op" hidden></div><div id="ms" style="display:flex;gap:6px;flex-wrap:wrap;align-items:center;margin-bottom:14px"></div>
<div class="stage"><div id="w"></div></div>
</div>
<script>
const sv=(p,s=18,c='currentColor',w=1.8)=>`<svg width="${s}" height="${s}" viewBox="0 0 24 24" fill="none" stroke="${c}" stroke-width="${w}" stroke-linecap="round" stroke-linejoin="round">${p}</svg>`;
const I={home:'<path d="M3 10.5 12 3l9 7.5V21h-6v-6H9v6H3z" fill="currentColor" stroke="none"/>',hist:'<circle cx="12" cy="12" r="9"/><path d="M12 7v5l3 2"/>',ins:'<path d="M5 20V11M10 20V5M15 20v-6M20 20V9"/>',dict:'<rect x="4" y="4" width="16" height="16" rx="3"/><path d="M4 12h16"/>',snip:'<path d="m8 8-4 4 4 4M16 8l4 4-4 4"/>',gear:'<circle cx="12" cy="12" r="3"/><path d="M12.22 2h-.44a2 2 0 0 0-2 2v.18a2 2 0 0 1-1 1.73l-.43.25a2 2 0 0 1-2 0l-.15-.08a2 2 0 0 0-2.73.73l-.22.38a2 2 0 0 0 .73 2.73l.15.1a2 2 0 0 1 1 1.72v.51a2 2 0 0 1-1 1.74l-.15.09a2 2 0 0 0-.73 2.73l.22.38a2 2 0 0 0 2.73.73l.15-.08a2 2 0 0 1 2 0l.43.25a2 2 0 0 1 1 1.73V20a2 2 0 0 0 2 2h.44a2 2 0 0 0 2-2v-.18a2 2 0 0 1 1-1.73l.43-.25a2 2 0 0 1 2 0l.15.08a2 2 0 0 0 2.73-.73l.22-.39a2 2 0 0 0-.73-2.73l-.15-.08a2 2 0 0 1-1-1.74v-.5a2 2 0 0 1 1-1.74l.15-.09a2 2 0 0 0 .73-2.73l-.22-.38a2 2 0 0 0-2.73-.73l-.15.08a2 2 0 0 1-2 0l-.43-.25a2 2 0 0 1-1-1.73V4a2 2 0 0 0-2-2z"/>',side:'<rect x="3" y="4" width="18" height="16" rx="3"/><path d="M9 4v16"/>',search:'<circle cx="11" cy="11" r="7"/><path d="m20 20-3.5-3.5"/>',mic:'<rect x="8.5" y="3" width="7" height="12" rx="3.5"/><path d="M5 11a7 7 0 0014 0M12 18v3"/>',arrow:'<path d="M5 12h14m-5-5 5 5-5 5"/>',doc:'<rect x="5" y="3" width="14" height="18" rx="2.5"/><path d="M9 8h6M9 12h6M9 16h4"/>',fire:'<path d="M12 3c1 4 5 5 5 10a5 5 0 01-10 0c0-2 1-3 2-4 0 2 1 3 2 3 0-4-1-6 1-9z" fill="currentColor" stroke="none"/>',bolt:'<path d="M13 3 5 14h6l-1 7 8-11h-6z" fill="currentColor" stroke="none"/>',target:'<circle cx="12" cy="12" r="8"/><circle cx="12" cy="12" r="3.5"/>',dots:'<circle cx="6" cy="12" r="1.3" fill="currentColor"/><circle cx="12" cy="12" r="1.3" fill="currentColor"/><circle cx="18" cy="12" r="1.3" fill="currentColor"/>'};
const ic=(k,s,c)=>sv(I[k],s,c);
const logoWave=`<span style="display:flex;align-items:center;gap:2px;height:22px">${[6,12,18,10,16,8].map((h,i)=>`<i style="width:2.5px;height:${h}px;border-radius:2px;background:linear-gradient(180deg,#8FF5EC,#1F8FB0)"></i>`).join('')}</span>`;
const side=`<aside class="side"><div class="glow"></div><div style="position:relative;display:flex;align-items:center;justify-content:space-between;padding:0 8px 22px"><div style="display:flex;align-items:center;gap:10px">${logoWave}<span style="font:600 21px var(--hf,var(--f));letter-spacing:-.02em">uttrflow</span></div><span style="color:rgba(255,255,255,.55)">${ic('side',18)}</span></div>
 <div class="nv on">${ic('home',18)}Home</div><div class="nv">${ic('hist',18)}History</div><div class="nv">${ic('ins',18)}Insights</div>
 <div class="grp">YOUR WORDS</div><div class="nv">${ic('dict',18)}Dictionary<span class="badge">3</span></div><div class="nv">${ic('snip',18)}Snippets</div>
 <div style="position:relative;margin-top:auto"><div class="nv">${ic('gear',18)}Settings</div><div style="display:flex;align-items:center;gap:12px;margin-top:10px;padding:12px;border-radius:14px;background:rgba(255,255,255,.06);box-shadow:inset 0 0 0 1px rgba(255,255,255,.08)"><span style="width:36px;height:36px;border-radius:50%;display:grid;place-items:center;background:linear-gradient(150deg,#C49BF5,#29C0B4);font:600 14px var(--f);color:#08131A">A</span><div style="font:500 14px var(--sys);line-height:1.3">Alex<br><span style="font-size:12px;color:rgba(255,255,255,.55)">v26.0926.0</span></div></div></div></aside>`;
const wave=(n=64)=>`<div style="display:flex;align-items:center;gap:3px;height:56px;-webkit-mask:linear-gradient(90deg,transparent,#000 12%,#000 88%,transparent);mask:linear-gradient(90deg,transparent,#000 12%,#000 88%,transparent)">${Array.from({length:n},(_,i)=>{const u=i/(n-1),e=Math.exp(-Math.pow(u-.5,2)*9);const h=Math.round(10+90*e*(.45+.55*Math.abs(Math.sin(i*1.7))));const c=u<.5?`rgb(${Math.round(95+(196-95)*u*2)},${Math.round(224+(155-224)*u*2)},${Math.round(211+(245-211)*u*2)})`:`rgb(${Math.round(196+(255-196)*(u-.5)*2)},${Math.round(155+(176-155)*(u-.5)*2)},${Math.round(245+(92-245)*(u-.5)*2)})`;return `<i style="width:2.5px;height:${h}%;border-radius:2px;background:${c};box-shadow:0 0 6px ${c};animation:wv ${(0.9+(i%7)/10).toFixed(1)}s ${(-(i%5)/5).toFixed(1)}s ease-in-out infinite"></i>`}).join('')}</div>`;
/* placeholder mascot drawn in SVG */
const panda=`<svg width="330" height="282" viewBox="0 -10 330 292" style="position:absolute;right:0;bottom:0">
 <defs><radialGradient id="halo" cx=".5" cy=".5" r=".5"><stop offset="0" stop-color="#1F8FB0" stop-opacity=".55"/><stop offset="1" stop-color="#1F8FB0" stop-opacity="0"/></radialGradient>
 <linearGradient id="fur" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#FFFFFF"/><stop offset="1" stop-color="#D9DEE6"/></linearGradient>
 <linearGradient id="lap" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#2A2F3D"/><stop offset="1" stop-color="#12151E"/></linearGradient></defs>
 <circle cx="175" cy="120" r="120" fill="url(#halo)"/>
 <path d="M60 170 a110 110 0 0 1 220 0" fill="none" stroke="rgba(95,224,211,.35)" stroke-width="1.5"/>
 <g style="animation:bob 4s ease-in-out infinite">
  <ellipse cx="170" cy="230" rx="92" ry="70" fill="url(#fur)"/>
  <ellipse cx="102" cy="200" rx="30" ry="46" fill="#15171C" transform="rotate(20 102 200)"/>
  <ellipse cx="238" cy="200" rx="30" ry="46" fill="#15171C" transform="rotate(-20 238 200)"/>
  <circle cx="115" cy="58" r="26" fill="#15171C"/><circle cx="225" cy="58" r="26" fill="#15171C"/>
  <ellipse cx="170" cy="112" rx="76" ry="66" fill="url(#fur)"/>
  <ellipse cx="140" cy="108" rx="18" ry="24" fill="#15171C" transform="rotate(25 140 108)"/>
  <ellipse cx="200" cy="108" rx="18" ry="24" fill="#15171C" transform="rotate(-25 200 108)"/>
  <circle cx="142" cy="106" r="8" fill="#fff"/><circle cx="198" cy="106" r="8" fill="#fff"/>
  <circle cx="144" cy="107" r="5" fill="#15171C"/><circle cx="196" cy="107" r="5" fill="#15171C"/>
  <circle cx="146" cy="104" r="1.8" fill="#fff"/><circle cx="198" cy="104" r="1.8" fill="#fff"/>
  <ellipse cx="170" cy="132" rx="11" ry="7" fill="#15171C"/>
  <path d="M160 145 q10 8 20 0" fill="none" stroke="#15171C" stroke-width="3" stroke-linecap="round"/>
  <ellipse cx="128" cy="138" rx="9" ry="5" fill="#F7B7C4" opacity=".55"/><ellipse cx="212" cy="138" rx="9" ry="5" fill="#F7B7C4" opacity=".55"/>
 </g>
 <path d="M60 282 L92 190 L226 190 L250 282Z" fill="url(#lap)" stroke="rgba(255,255,255,.12)"/>
 <g transform="translate(160 235)">${[6,12,18,10,16].map((h,i)=>`<rect x="${i*5}" y="${-h/2}" width="2.6" height="${h}" rx="1.3" fill="#6BB4F5"/>`).join('')}</g>
 <ellipse cx="96" cy="230" rx="30" ry="22" fill="#15171C"/><ellipse cx="230" cy="232" rx="30" ry="22" fill="#15171C"/>
 <g transform="translate(262 140)"><path d="M20 90 C 10 60, 30 40, 25 10 M20 90 C 30 60, 50 55, 55 30 M20 90 C 5 70, -10 60, -8 40" fill="none" stroke="#2F8F6E" stroke-width="3"/><ellipse cx="25" cy="12" rx="7" ry="14" fill="#2F8F6E"/><ellipse cx="55" cy="30" rx="7" ry="13" fill="#2F8F6E" transform="rotate(30 55 30)"/><ellipse cx="-8" cy="40" rx="6" ry="12" fill="#2F8F6E" transform="rotate(-30 -8 40)"/></g>
 <g transform="translate(250 212)">${['Ideas','Notes','Progress'].map((t,i)=>`<rect x="${i*-3}" y="${i*22}" width="80" height="20" rx="3" fill="${['#22283A','#1C2130','#181C28'][i]}" stroke="rgba(255,255,255,.1)"/><text x="${14-i*3}" y="${i*22+14}" font-family="Outfit" font-size="10.5" fill="rgba(255,255,255,.75)">${t}</text>`).join('')}</g>
</svg>`;
/* Set MASCOT to the image file you provide (e.g. 'mascot.png'); until then the drawn placeholder shows. */
const MASCOTS=[['../../Sources/Uttrflow/Resources/Mood/panda-early-morning.jpg','Early morning','Good morning',5],['../../Sources/Uttrflow/Resources/Mood/panda-morning.jpg','Morning','Good morning',8],['../../Sources/Uttrflow/Resources/Mood/panda-afternoon.jpg','Afternoon','Good afternoon',12],['../../Sources/Uttrflow/Resources/Mood/panda-evening.jpg','Evening','Good evening',17],['../../Sources/Uttrflow/Resources/Mood/panda-night.jpg','Night','Good evening',20],['../../Sources/Uttrflow/Resources/Mood/panda-late-night.jpg','Late night','Working late',23]];
const moodFor=h=>{let k=MASCOTS.length-1;MASCOTS.forEach((m,i)=>{if(h>=m[3])k=i});return h<5?5:k};let MI=moodFor(new Date().getHours());let MASCOT=MASCOTS[0][0];

const W3=(a,b,c)=>`<div class="hw"><span style="color:#5FE0D3">${a}</span> <span style="color:#C49BF5">${b}</span> <span style="color:#FFB05C">${c}</span></div>`;
const SUB=t=>`<div style="font:400 16px var(--f);color:rgba(255,255,255,.72);margin:12px 0 20px">${t}</div>`;
const HEADS=[
 ()=>W3('Speak.','Finish.','Recall.')+SUB('Turn your thoughts into clear, structured notes.'),
 ()=>`<div style="display:flex;gap:22px">${[['Speak.','#5FE0D3','Dictation'],['Finish.','#C49BF5','AI suggestions'],['Recall.','#FFB05C','Clipboard']].map(([w,c,l])=>`<div><div class="hw" style="font-family:var(--hf,var(--f));color:${c}">${w}</div><div style="font:600 10.5px var(--sys);letter-spacing:.12em;text-transform:uppercase;color:${c};opacity:.75;margin-top:8px">${l}</div></div>`).join('')}</div><div style="height:22px"></div>`,
 ()=>W3('Say it.','Tab it.','Paste it.')+SUB('Dictate anywhere, accept a suggestion with Tab, bring back anything you copied.'),
 ()=>`<div class="hw" style="font-family:var(--hf,var(--f));font-size:40px;width:560px">Your voice, <span style="background:linear-gradient(90deg,#5FE0D3,#C49BF5,#FFB05C);-webkit-background-clip:text;color:transparent">finished for you.</span></div>`+SUB(`<span style="color:#5FE0D3">Dictation</span> · <span style="color:#C49BF5">AI suggestions</span> · <span style="color:#FFB05C">Clipboard</span>`)];
const HN=['A · Speak Finish Recall (now)','B · Same words, labelled','C · Say it. Tab it. Paste it.','D · One line + three names'];
const M='rgba(255,255,255,.88)',M2='rgba(255,255,255,.45)',MB='rgba(255,255,255,.05)',ML='inset 0 0 0 1px rgba(255,255,255,.12)';
const monoWave=(n=64)=>`<div style="display:flex;align-items:center;gap:3px;height:56px;-webkit-mask:linear-gradient(90deg,transparent,#000 12%,#000 88%,transparent);mask:linear-gradient(90deg,transparent,#000 12%,#000 88%,transparent)">${Array.from({length:n},(_,i)=>{const u=i/(n-1),e=Math.exp(-Math.pow(u-.5,2)*9);const h=Math.round(10+90*e*(.45+.55*Math.abs(Math.sin(i*1.7))));return `<i style="flex:1;height:${h}%;border-radius:2px;background:${M};opacity:${.35+.6*e}"></i>`}).join('')}</div>`;
const VIS=[
 ()=>monoWave(),
 ()=>`<div style="display:flex;align-items:center;gap:12px;height:56px;padding:0 16px;border-radius:14px;background:${MB};box-shadow:${ML};font:400 15px var(--sys)"><span style="color:${M}">${ic('mic',18)}</span><span style="white-space:nowrap;overflow:hidden;color:${M}">Move the review to Thursday<span style="color:${M2}"> at 10 am?</span></span><span style="margin-left:auto;flex:none;font:600 11px var(--sys);padding:3px 8px;border-radius:6px;background:rgba(255,255,255,.1);color:${M}">Tab</span></div>`,
 ()=>`<div style="display:flex;gap:10px">${[['mic','Hold ⌃⌥','to dictate'],['bolt','Tab','to accept'],['doc','⌘⇧V','clipboard']].map(([k,a,b])=>`<div style="flex:1;display:flex;align-items:center;gap:10px;height:56px;padding:0 12px;border-radius:14px;background:${MB};box-shadow:${ML}"><span style="color:${M}">${ic(k,18)}</span><div style="line-height:1.25"><div style="font:600 13px var(--sys)">${a}</div><div style="font-size:11.5px;color:${M2}">${b}</div></div></div>`).join('')}</div>`,
 ()=>`<div style="display:flex;align-items:center;gap:10px;height:56px;color:${M}">${[['mic','Voice'],['doc','Text'],['bolt','Suggest'],['snip','Clipboard']].map(([k,l],i)=>`${i?`<span style="color:${M2}">${ic('arrow',16)}</span>`:''}<span style="display:inline-flex;align-items:center;gap:8px;height:38px;padding:0 12px;border-radius:999px;background:${MB};box-shadow:${ML};font:500 13px var(--sys)">${ic(k,15)}${l}</span>`).join('')}</div>`,
 ()=>`<div style="height:56px;display:flex;align-items:center;font:400 19px var(--sys);color:${M}"><span class="tw">Hi Priya, can we move the review to Thursday?</span><i style="width:2px;height:22px;margin-left:3px;background:${M};animation:blink 1s steps(1) infinite"></i></div>`,
 ()=>`<div style="display:flex;align-items:center;gap:12px;height:56px;color:${M2};font:500 14px var(--sys)">${['⌃','⌥'].map(k=>`<span style="width:52px;height:52px;border-radius:12px;display:grid;place-items:center;font:500 22px var(--sys);color:${M};background:linear-gradient(180deg,rgba(255,255,255,.12),rgba(255,255,255,.04));box-shadow:inset 0 0 0 1px rgba(255,255,255,.18),0 3px 0 rgba(0,0,0,.5)">${k}</span>`).join('<span>+</span>')}<span style="margin-left:6px">Hold anywhere and talk.<br>Let go, and it types.</span></div>`,
 ()=>`<div style="display:grid;gap:7px">${['Hi Priya, can we move the review to Thursday?','Can you send the deck before lunch?'].map((t,i)=>`<div style="display:flex;align-items:center;gap:10px;font:400 14px var(--sys);color:${i?M2:M}"><span style="font:500 11px var(--mono);color:${M2}">${['10:41','10:12'][i]}</span>${t}</div>`).join('')}</div>`,
 ()=>``];
const VN=['A · Waveform','B · Live sentence + ghost','C · Three shortcut keys','D · Voice → text → suggestion → clipboard','E · Typing text + caret','F · Hold-the-keys','G · Last two dictations','H · Nothing'];
const STN=['A · Sparklines (now)','B · 7-day bars','C · Goal ring','D · Clean, change vs last week'];
let OH=3,OV=0,OS=2;

const PILL=(dis)=>`<div style="margin-top:22px;display:inline-flex;align-items:center;gap:12px;padding:12px 26px;border-radius:999px;background:rgba(95,224,211,.08);box-shadow:inset 0 0 0 1.5px #5FE0D3,0 0 24px -6px rgba(95,224,211,.7),inset 0 0 18px -6px rgba(196,155,245,.6);font:500 15px var(--sys);${dis?'opacity:.4;box-shadow:inset 0 0 0 1.5px rgba(255,255,255,.3)':''}">${ic('mic',18)}Start speaking <span style="margin-left:6px">${ic('arrow',16)}</span></div>`;
const STL=(t,sub,c)=>`<div style="margin-top:4px"><div style="display:flex;align-items:center;gap:10px;font:600 15px var(--sys)"><span style="width:8px;height:8px;border-radius:50%;background:${c}"></span>${t}</div><div style="margin:4px 0 0 18px;font:400 13px var(--sys);color:rgba(255,255,255,.55)">${sub}</div></div>`;
const BAR=(f)=>`<div style="position:relative;width:300px;height:4px;border-radius:2px;background:rgba(255,255,255,.1);margin:10px 0 0 18px;overflow:hidden"><i style="position:absolute;left:0;top:0;bottom:0;border-radius:2px;background:linear-gradient(90deg,#1F8FB0,#5FE0D3);${f==null?'width:30%;animation:slide 1.6s ease-in-out infinite':'width:'+f+'%'}"></i></div>`;
const BTN=(t,c)=>`<div style="margin-top:18px;display:inline-flex;align-items:center;gap:10px;padding:11px 22px;border-radius:999px;background:${c};color:#0B0C10;font:600 14px var(--sys)">${t}</div>`;
const MSACT=[
 ()=>PILL(false),
 ()=>STL('Setting up… 42%','Downloading the speech model · 612 MB of 1.4 GB','#5FE0D3')+BAR(42)+`<div>${PILL(true)}</div>`,
 ()=>STL('Getting ready…','Loading the speech model, usually a few seconds','#5FE0D3')+BAR(null)+`<div>${PILL(true)}</div>`,
 ()=>STL("Speech model didn't load",'Nothing was lost. Try loading it again.','#FFB05C')+BTN('Try again','#FFB05C'),
 ()=>STL('Speech model not installed','Dictation needs it · 1.4 GB, works offline after','#FFB05C')+BTN('Download speech model','#5FE0D3')];
const MSN=['Ready','Downloading','Getting ready','Didn\'t load','Not installed'];let MS=0;
const heroCardF=()=>`<div class="hero"><div style="position:absolute;left:40px;top:40px;width:470px">
${HEADS[OH]()}
 ${MS?'':VIS[OV]()}
 ${MSACT[MS]()}</div>
 ${MASCOT?`<div style="position:absolute;right:0;top:0;bottom:0;width:390px;background:url(${MASCOT}) center 40%/cover;-webkit-mask:linear-gradient(90deg,transparent 0,#000 42%);mask:linear-gradient(90deg,transparent 0,#000 42%)"></div>`:panda}
 ${MASCOT?'':`<div style="position:absolute;right:26px;top:26px;font:500 18px/1.1 Caveat,cursive;color:rgba(255,255,255,.72);transform:rotate(-8deg);text-align:right">Good<br>ideas<br>sound<br>better<br>here.</div>`}</div>`;
const spark=(c,pts)=>`<svg width="90" height="30" viewBox="0 0 90 30" style="position:absolute;right:14px;bottom:12px"><defs><linearGradient id="g${c.slice(1)}" x1="0" x2="1"><stop offset="0" stop-color="${c}" stop-opacity="0"/><stop offset="1" stop-color="${c}"/></linearGradient></defs><path d="${pts}" fill="none" stroke="url(#g${c.slice(1)})" stroke-width="2.2" stroke-linecap="round" style="filter:drop-shadow(0 0 4px ${c})"/></svg>`;
const WK=[[.4,.55,.5,.7,.6,.85,1],[.9,1,1,1,1,1,1],[.6,.7,.65,.8,.75,.85,.9],[.8,.9,.85,.95,.9,.92,.94]];let WI=0;
const DL=['+12%','best: 9','+6','+2%'];
const STX=[(c,p)=>spark(c,p),
 (c)=>{const d=WK[WI++%4];return `<div style="position:absolute;right:16px;bottom:18px;display:flex;align-items:flex-end;gap:3px;height:30px">${d.map((v,i)=>`<i style="width:6px;height:${Math.round(v*30)}px;border-radius:2px;background:${c};opacity:${i===6?1:.35}"></i>`).join('')}</div>`},
 (c)=>{const v=[.64,.86,.71,.94][WI++%4],r=15,L=2*Math.PI*r;return `<svg width="40" height="40" viewBox="0 0 40 40" style="position:absolute;right:16px;top:17px;transform:rotate(-90deg)"><circle cx="20" cy="20" r="${r}" fill="none" stroke="rgba(255,255,255,.1)" stroke-width="4"/><circle cx="20" cy="20" r="${r}" fill="none" stroke="${c}" stroke-width="4" stroke-linecap="round" stroke-dasharray="${L*v} ${L}"/></svg>`},
 (c)=>`<span style="position:absolute;right:16px;top:50%;transform:translateY(-50%);font:600 11.5px var(--sys);padding:3px 8px;border-radius:999px;background:rgba(255,255,255,.07);color:rgba(255,255,255,.7)">${DL[WI++%4]}</span>`];
const stat=(k,c,v,l,p)=>`<div class="stat" style="background:linear-gradient(135deg,color-mix(in srgb,${c} 16%,transparent),rgba(255,255,255,.03));box-shadow:inset 0 0 0 1px color-mix(in srgb,${c} 28%,transparent)"><span style="width:42px;height:42px;border-radius:50%;display:grid;place-items:center;background:color-mix(in srgb,${c} 22%,transparent);color:${c}">${ic(k,20)}</span><div><div style="font:600 21px var(--f);letter-spacing:-.02em">${v}</div><div style="font-size:12.5px;color:rgba(255,255,255,.62);margin-top:1px">${l}</div></div>${STX[OS](c,p)}</div>`;
const statsF=()=>`<div style="display:grid;grid-template-columns:repeat(4,1fr);gap:12px">${stat('doc','#5FE0D3','1,284','words today','M2 26 C 20 26, 30 22, 45 18 S 70 8, 88 4')}${stat('fire','#FFB05C','6 days','streak','M2 26 C 25 25, 40 20, 55 16 S 75 10, 88 3')}${stat('bolt','#C49BF5','142','words / min','M2 25 C 20 26, 35 22, 50 20 S 70 12, 88 5')}${stat('target','#6BB4F5','94%','left as dictated','M2 24 C 22 26, 38 20, 52 18 S 72 8, 88 6')}</div>`;
const APP={Slack:['linear-gradient(145deg,#611f69,#3F0F40)','<path d="M9 3v18M15 3v18M3 9h18M3 15h18" stroke="#fff" stroke-width="2.2" stroke-linecap="round" fill="none"/>'],Mail:['linear-gradient(180deg,#3FA2FF,#1467E0)','<rect x="3" y="6" width="18" height="12" rx="2" fill="#fff"/><path d="m4 7 8 6 8-6" stroke="#1467E0" stroke-width="1.8" fill="none"/>'],Note:['linear-gradient(180deg,#5A5F70,#3A3E4A)','<rect x="5" y="3" width="14" height="18" rx="2.5" fill="#fff"/><path d="M8 9h8M8 13h8M8 17h5" stroke="#5A5F70" stroke-width="1.6" stroke-linecap="round"/>']};
const appX=(a)=>`<span style="width:38px;height:38px;border-radius:10px;display:grid;place-items:center;flex:none;background:${APP[a][0]};box-shadow:inset 0 1px 0 rgba(255,255,255,.25)"><svg width="22" height="22" viewBox="0 0 24 24">${APP[a][1]}</svg></span>`;
const ROWS=[['10:41','#5FE0D3','Slack','Hi Priya, can we move the design review to Thursday at 10 so the team has a day?','23 words','2 changes','#C49BF5'],['10:12','#6BB4F5','Mail','Can you send the deck before lunch?','7 words','Polished','#5FE0D3'],['09:28','#C49BF5','Note','Product ideas – quick notes','149 words','Summarised','#C49BF5']];
const recent=`<div class="card" style="flex:1;padding:16px 18px"><div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:12px"><span style="display:flex;align-items:center;gap:10px;font:600 15px var(--f)"><i style="width:9px;height:9px;border-radius:50%;background:#5FE0D3;box-shadow:0 0 8px #5FE0D3"></i>Recent activity</span><span style="display:flex;align-items:center;gap:6px;color:#5FE0D3;font-size:13.5px">View all ${ic('arrow',14)}</span></div>
 <div style="position:relative;padding-left:70px;display:grid;gap:8px"><i style="position:absolute;left:52px;top:10px;bottom:10px;width:2px;background:linear-gradient(180deg,#5FE0D3,#6BB4F5,#C49BF5)"></i>
 ${ROWS.map(([t,dc,a,x,w,tag,tc])=>`<div style="position:relative"><span style="position:absolute;left:-70px;top:21px;font:500 11px var(--mono);color:rgba(255,255,255,.5)">${t}</span><i style="position:absolute;left:-23px;top:22px;width:11px;height:11px;border-radius:50%;background:${dc};box-shadow:0 0 0 3px #0C0D14,0 0 10px ${dc}"></i><div class="row">${appX(a)}<div style="flex:1;min-width:0"><div style="font-size:14px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis">${x}</div><div style="display:flex;gap:10px;font-size:12px;color:rgba(255,255,255,.5);margin-top:3px"><span>${a}</span>·<span>${w}</span>·<span style="color:${tc}">${tag}</span></div></div><span class="vbtn">View</span><span class="mbtn">${ic('dots',16)}</span></div></div>`).join('')}</div></div>`;
const topBarF=()=>`<div style="display:flex;align-items:flex-end;justify-content:space-between"><div><div style="font-size:13px;color:rgba(255,255,255,.55)">Sunday, 27 September</div><div style="font:600 30px var(--hf,var(--f));letter-spacing:-.03em;margin-top:4px">${MASCOTS[MI][2]}, Alex</div></div><div style="display:flex;align-items:center;gap:10px;width:300px;height:40px;padding:0 14px;border-radius:12px;background:rgba(255,255,255,.05);box-shadow:inset 0 0 0 1px rgba(255,255,255,.12);color:rgba(255,255,255,.5);font-size:13.5px">${ic('search',16)}Search your words…<span style="margin-left:auto;font:500 11px var(--sys);padding:2px 7px;border-radius:6px;background:rgba(255,255,255,.1);color:rgba(255,255,255,.75)">⌘ K</span></div></div>`;
function opts(){const row=(t,n,v,k)=>`<div style="display:flex;gap:6px;flex-wrap:wrap;align-items:center"><b style="font:600 12px var(--f);width:92px;color:var(--mute)">${t}</b>${n.map((x,i)=>`<button data-o="${k}" data-i="${i}" style="all:unset;cursor:pointer;padding:5px 12px;border-radius:999px;border:1px solid var(--line);font:500 12.5px var(--f);${i===v?'background:var(--ink);color:var(--pg)':'color:var(--mute)'}">${x}</button>`).join('')}</div>`;op.innerHTML=row('Headline',HN,OH,'H')+row('Hero visual',VN,OV,'V')+row('Stat boxes',STN,OS,'S')}
op.onclick=e=>{const b=e.target.closest('[data-o]');if(!b)return;const i=+b.dataset.i;({H:()=>OH=i,V:()=>OV=i,S:()=>OS=i})[b.dataset.o]();render()};
function render(){ms.innerHTML=`<b style="font:600 12px var(--f);color:var(--mute);margin-right:6px">Speech model</b>`+MSN.map((x,i)=>`<button data-s="${i}" style="all:unset;cursor:pointer;padding:5px 12px;border-radius:999px;border:1px solid var(--line);font:500 12.5px var(--f);${i===MS?'background:var(--ink);color:var(--pg)':'color:var(--mute)'}">${x}</button>`).join('');opts();MASCOT=MASCOTS[MI][0];mp.innerHTML=MASCOTS.map((m,i)=>`<button data-m="${i}" style="all:unset;cursor:pointer;display:inline-flex;align-items:center;gap:8px;padding:5px 12px 5px 5px;border-radius:999px;border:1px solid var(--line);font:500 12.5px var(--f);${i===MI?'background:var(--ink);color:var(--pg)':'color:var(--mute)'}"><img src="${m[0]}" alt="" width="26" height="26" style="border-radius:50%;object-fit:cover">${m[1]}</button>`).join('');w.innerHTML=`<div class="win"><div class="lights"><i></i><i></i><i></i></div>${side}<main class="main">${topBarF()}${heroCardF()}${(WI=0,statsF())}${recent}</main></div>`;fit()}
ms.onclick=e=>{const b=e.target.closest('[data-s]');if(b){MS=+b.dataset.s;render()}};
mp.onclick=e=>{const b=e.target.closest('[data-m]');if(b){MI=+b.dataset.m;render()}};
function fit(){const el=w.firstElementChild;const sc=Math.min(1,(document.querySelector('.stage').clientWidth-44)/1140);el.style.transform=`scale(${sc})`;w.style.height=760*sc+'px'}
addEventListener('resize',fit);render();
</script>
