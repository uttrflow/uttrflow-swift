<meta charset="utf-8">
<title>Profile Page Options</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600;700&family=JetBrains+Mono:wght@500&display=swap">
<style>
:root{--pg:#F2F1EC;--ink:#101316;--mute:#5C6866;--line:#DEDCD4;--f:"Outfit",-apple-system,system-ui,sans-serif;--sys:-apple-system,BlinkMacSystemFont,"SF Pro Text",system-ui,sans-serif;--mono:"JetBrains Mono",ui-monospace,Menlo,monospace}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){color-scheme:dark;--pg:#08090C;--ink:#F4F4F6;--mute:#8B90A0;--line:#1E212A}}
:root[data-theme="dark"]{color-scheme:dark;--pg:#08090C;--ink:#F4F4F6;--mute:#8B90A0;--line:#1E212A}
*{box-sizing:border-box}
body{background:var(--pg);color:var(--ink);font-family:var(--sys);padding-block:28px 48px;padding-inline:16px}
.shell{max-width:1100px;margin:0 auto}
h1{font:600 24px var(--f);letter-spacing:-.02em;margin:0 0 4px}
.lede{color:var(--mute);font-size:13px;margin:0 0 14px;max-width:85ch;line-height:1.5}
.bar{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:12px}
.pk{all:unset;cursor:pointer;font:500 12.5px var(--f);padding:6px 12px;border-radius:999px;border:1px solid var(--line);color:var(--mute)}
.pk[aria-pressed="true"]{background:var(--ink);color:var(--pg);border-color:var(--ink)}
.note{font-size:13.5px;margin:0 0 14px}
.stage{overflow:hidden;border-radius:16px;border:1px solid var(--line);padding:18px;background:radial-gradient(100% 80% at 50% 0%,rgba(97,57,159,.14),transparent),var(--pg)}
.win{width:1000px;height:640px;border-radius:14px;overflow:hidden;position:relative;display:grid;grid-template-columns:210px 1fr;background:#0B0C10;color:#fff;box-shadow:0 0 0 .5px rgba(0,0,0,.6),0 30px 70px -20px rgba(20,10,40,.6);transform-origin:top left}
.lights{position:absolute;top:16px;left:16px;display:flex;gap:8px;z-index:9}.lights i{width:12px;height:12px;border-radius:50%;background:#FF5F57}.lights i:nth-child(2){background:#FEBC2E}.lights i:nth-child(3){background:#28C840}
.side{background:rgba(255,255,255,.03);border-right:1px solid rgba(255,255,255,.07);padding:52px 12px 14px;display:flex;flex-direction:column;gap:2px}
.nav{display:flex;align-items:center;gap:10px;padding:7px 10px;border-radius:8px;font-size:13px;color:rgba(255,255,255,.65)}
.nav.on{background:rgba(95,224,211,.14);color:#fff;box-shadow:inset 0 0 0 1px rgba(95,224,211,.25)}
.main{position:relative;overflow:hidden;padding:44px 34px 28px}
.gl{background:rgba(255,255,255,.05);box-shadow:inset 0 0 0 1px rgba(255,255,255,.09);border-radius:16px}
.h{font:600 30px/1.05 var(--f);letter-spacing:-.03em;margin:0}
.lab{font:600 10.5px var(--sys);letter-spacing:.07em;color:rgba(255,255,255,.45)}
kbd{font:500 12px var(--sys);padding:2px 7px;border-radius:6px;background:rgba(255,255,255,.14)}
.row{display:flex;align-items:center;gap:12px;padding:10px 12px;border-radius:10px;font-size:13.5px}
.row .t{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;color:rgba(255,255,255,.88)}
.row .tm{font:500 11px var(--mono);color:rgba(255,255,255,.4)}
@keyframes spin{to{transform:rotate(360deg)}}
@media (prefers-reduced-motion:reduce){*{animation:none!important}}
</style>
<div class="shell">
<h1>Profile page · A</h1>
<p class="lede">Mockups only, inside the frozen sidebar (the account card at the bottom is selected). Shows only what the app already knows: name, email, sign-in provider, member since, this Mac, and Sign out. No plan. Name and email are examples.</p>

<p class="note" id="nt"></p>
